<body class="bg-[#ecf0f3] overflow-x-hidden text-gray-800">
    <div id="header-placeholder"></div>

    <main class="pt-24 md:pt-32 pb-16 md:pb-24 px-4 sm:px-6 min-h-screen">
        <div id="content-container" class="max-w-5xl mx-auto">
            <!-- Included Component Content -->
            <div id="about-content">
                <!-- Dynamically or statically populated -->
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.loadComponent) {
                await loadComponent('header-placeholder', 'include/header');
                await loadComponent('footer-placeholder', 'include/footer');
            }
            try {
                const res = await fetch('include/komponent_footer/about');
                if (res.ok) {
                    const container = document.getElementById('about-content');
                    container.innerHTML = await res.text();
                    
                    // Execute scripts inside loaded content
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    if (window.lucide) lucide.createIcons();
                }
            } catch (e) {
                console.error("Gagal memuat konten about:", e);
            }
        });
    </script>
